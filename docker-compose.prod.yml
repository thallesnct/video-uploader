# Production-shaped overlay — applied on top of docker-compose.yml
# (`docker compose -f docker-compose.yml -f docker-compose.prod.yml ...`).
# Phase 12 seeds this file with the two production concerns that are
# genuinely dangerous to rehearse against the shared dev stack — Postgres
# PITR (this block; infra/backup_verify.py destroys a data directory as
# part of proving restore) and the Kafka TLS+SASL/RF=3 profile — each
# always run under its own isolated `docker compose -p` project name, never
# the default one, so a rehearsal can never touch the dev volumes this
# session's other phases depend on. Phase 13 extends this same file with
# the rest of the hardened deployment profile; it is grown, never replaced.
#
# No live deployment target (PLAN.md's scope note): this overlay is stood
# up locally long enough for its own *_verify.py to prove it, then torn
# down unconditionally — never left running.

services:
  # WAL archiving for point-in-time recovery. archive_command only fires
  # once a WAL file is complete (a checkpoint, a full 16MB segment, or an
  # explicit pg_switch_wal()) — infra/backup_verify.py calls
  # pg_switch_wal() itself after each write it needs archived promptly,
  # rather than waiting on Postgres's own timers.
  #
  # container_name/ports are overridden (not just extended) so a rehearsal
  # run can never collide with the dev stack's already-running vp-postgres,
  # whether or not that dev container happens to be up at the time.
  postgres:
    container_name: vp-postgres-pitr
    # No `ports:` override here — Compose *concatenates* list-valued fields
    # like `ports` across files rather than replacing them (verified via
    # `docker compose config`: an override list, empty or not, adds to the
    # base file's mapping instead of replacing it), so the base file's
    # `${POSTGRES_PORT:-5432}:5432` would still bind host 5432 no matter
    # what's written here. infra/backup_verify.py instead sets POSTGRES_PORT
    # in its own subprocess environment before calling `docker compose up`,
    # which the base file's interpolation picks up directly — the one lever
    # that actually avoids colliding with the dev stack's published 5432.
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /archive/%f && cp %p /archive/%f
      - -c
      - wal_level=replica
    volumes:
      - pg-data:/var/lib/postgresql/data
      - pg-archive:/archive

  # Three-broker KRaft cluster (ADR-0015: RF=3, min.insync.replicas=2, no
  # unclean leader election, auto-create off, TLS+SASL), rehearsed once
  # (confirmed with the user — no live deployment target). These are new
  # service names, not overrides of the base file's single-node `kafka` —
  # unlike postgres above, there's nothing to merge/collide with, so no
  # container_name/ports trap here: each gets its own name and no published
  # port at all (infra/kafka_prod_verify.py drives everything through
  # `docker compose exec`, matching infra/backup_verify.py's precedent).
  #
  # Inter-broker traffic stays on the internal PLAINTEXT listener
  # (KAFKA_INTER_BROKER_LISTENER_NAME) — brokers never TLS-handshake with
  # each other. Only the client-facing SASL_SSL listener is authenticated,
  # which is what the phase's own gate actually needs to prove: a real
  # client, with real credentials, sees RF=3/ISR=3. Certs come from
  # infra/gen_kafka_certs.sh (gitignored, regenerated each run).
  # No YAML anchors here (unlike the temptation to share the three brokers'
  # near-identical blocks) — this repo's other compose files never use them
  # either, and each broker genuinely differs in NODE_ID, its own data
  # volume, and its own ADVERTISED_LISTENERS hostname, which a shared
  # anchor would either have to override per-broker anyway (no real
  # savings) or, worse, silently share (a real bug: two brokers advertising
  # the same hostname). Explicit per-broker blocks, matching every other
  # service in this repo's compose files.
  kafka-1:
    image: confluentinc/cp-kafka:7.6.1
    container_name: vp-kafka-1
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,SASL_SSL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,SASL_SSL://kafka-1:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SASL_SSL:SASL_SSL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf
      KAFKA_SSL_KEYSTORE_FILENAME: kafka.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore_creds
      KAFKA_SSL_KEY_CREDENTIALS: key_creds
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka.truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: truststore_creds
      KAFKA_SSL_CLIENT_AUTH: none
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-prod-1-data:/var/lib/kafka/data
      - ./infra/kafka-certs:/etc/kafka/secrets:ro
    networks: [default]

  kafka-2:
    image: confluentinc/cp-kafka:7.6.1
    container_name: vp-kafka-2
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,SASL_SSL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,SASL_SSL://kafka-2:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SASL_SSL:SASL_SSL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf
      KAFKA_SSL_KEYSTORE_FILENAME: kafka.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore_creds
      KAFKA_SSL_KEY_CREDENTIALS: key_creds
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka.truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: truststore_creds
      KAFKA_SSL_CLIENT_AUTH: none
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-prod-2-data:/var/lib/kafka/data
      - ./infra/kafka-certs:/etc/kafka/secrets:ro
    networks: [default]

  kafka-3:
    image: confluentinc/cp-kafka:7.6.1
    container_name: vp-kafka-3
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,SASL_SSL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092,SASL_SSL://kafka-3:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SASL_SSL:SASL_SSL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf
      KAFKA_SSL_KEYSTORE_FILENAME: kafka.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore_creds
      KAFKA_SSL_KEY_CREDENTIALS: key_creds
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka.truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: truststore_creds
      KAFKA_SSL_CLIENT_AUTH: none
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-prod-3-data:/var/lib/kafka/data
      - ./infra/kafka-certs:/etc/kafka/secrets:ro
    networks: [default]

volumes:
  pg-archive:
  kafka-prod-1-data:
  kafka-prod-2-data:
  kafka-prod-3-data:
