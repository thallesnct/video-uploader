# Development stack. The hardened production profile is Phase 13 (ADR-0015);
# this file deliberately runs a relaxed configuration for local work — though
# less relaxed than that framing suggests: non-root/read-only-rootfs/
# cap_drop:ALL/no-new-privileges and (Phase 12) per-worker cpus/mem_limit and
# stop_grace_period are already on every worker below, not deferred.
#
# Seccomp (ADR-0015 §1, Phase 12): every service below runs under Docker's
# *default* seccomp profile, not a custom one — a deliberate decision, not an
# oversight. The default profile already blocks the dangerous syscall classes
# (ptrace, kernel module loading, raw sockets, mount, etc.); a custom profile
# narrower than that is a real, easy-to-get-wrong undertaking (enumerating
# every syscall glibc/ffmpeg/librdkafka/psycopg genuinely need, then keeping
# that list correct across every dependency upgrade) that a project with no
# live deployment target doesn't get to spend that engineering budget on.
# cap_drop:ALL/read-only rootfs/non-root, plus the no-egress network
# isolation this same phase adds for make security-verify's egress check,
# already cover the realistic threat from a compromised ffmpeg process; a
# custom seccomp profile is this repo's named upgrade path
# if that threat model ever changes, not a silently-skipped checklist item.
name: video-pipeline

services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: vp-kafka
    ports:
      - "${KAFKA_EXTERNAL_PORT:-29092}:29092"
    environment:
      # --- KRaft: broker and controller in one node, no ZooKeeper (ADR-0011) ---
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Two client listeners: kafka:9092 in-network, localhost:29092 from the host.
      # Bind on 0.0.0.0 so in-container tooling and the healthcheck can reach the
      # broker on localhost; advertise the routable names clients must dial.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      # Single broker: the internal topics default to RF=3 and would fail to create.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # ADR-0002: topics are declared in infra/topics.json, never conjured by a typo.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    # On both networks (Phase 12): `default` for its published host port
    # (make replay/smoke/integration tests all reach it via localhost), and
    # `media-internal` so the egress-restricted media workers below can
    # still reach it by service name — internal:true has no route out, but
    # a service *on* it reaches every other service also on it fine.
    networks: [default, media-internal]

  postgres:
    image: postgres:16-alpine
    container_name: vp-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # See kafka's comment.
    networks: [default, media-internal]

  minio:
    image: minio/minio:latest
    container_name: vp-minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Browser uploads PUT directly here (ADR-0006), so the SPA origin must be
      # allowed. MinIO takes CORS from the server, not per-bucket via mc.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    # See kafka's comment.
    networks: [default, media-internal]

  devauth:
    build:
      context: ./backend
      dockerfile: services/devauth/Dockerfile
    container_name: vp-devauth
    ports:
      - "${DEVAUTH_PORT:-8080}:8080"
    # Phase 12, caught by make security-verify's own first real run: every
    # other service already had this, devauth was the one gap — a plain
    # stateless FastAPI app reading a static signing key, no reason it
    # needed to be the exception.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8080/healthz')\""]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
      dockerfile: services/api/Dockerfile
    container_name: vp-migrate
    profiles: ["tools"]
    command: ["alembic", "upgrade", "head"]
    environment:
      # Alembic runs synchronously, so this stays the psycopg URL.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  # api/worker-probe/worker-transcode/projector all need Kafka topics (and
  # api/worker-transcode/projector a migrated schema) to exist before they can
  # start without crash-looping — `UnknownTopicOrPartitionError` otherwise,
  # found running this stack for real in Phase 8. `make up` brings up only the
  # infra services and bootstraps them; profiles: ["app"] keeps these four out
  # of that bare `docker compose up` so bootstrap always wins the race. `make
  # e2e` starts this profile explicitly, after bootstrap and migrate.
  api:
    build:
      context: ./backend
      dockerfile: services/api/Dockerfile
    container_name: vp-api
    restart: unless-stopped
    profiles: ["app"]
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://minio:9000
      # A presigned URL's signature covers its host — a host-run browser
      # can't resolve "minio", only "localhost" (ADR-0006 follow-on).
      # Overridden to http://minio:9000 for `make e2e`: there the browser
      # itself runs inside the compose network (Playwright's container), so
      # "localhost" would mean that container, not the host.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      OIDC_ISSUER: http://devauth:8080
      OIDC_JWKS_URL: http://devauth:8080/jwks.json
      OIDC_AUDIENCE: video-pipeline
      API_CORS_ALLOW_ORIGINS: ${API_CORS_ALLOW_ORIGINS:-http://localhost:5173}
      SERVICE_NAME: api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    # ADR-0015 hardening, applied in dev too so the gap between dev and prod
    # stays small enough to notice.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      devauth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  worker-probe:
    build:
      context: ./backend
      dockerfile: services/worker_probe/Dockerfile
      target: runtime
    container_name: vp-worker-probe
    restart: unless-stopped
    # Sized from a real run, not guessed (Phase 12): docker stats during an
    # actual upload peaked at ~82MiB / <10% CPU (ffprobe is a cheap read, no
    # encode). 1 CPU / 256m gives real headroom for a longer/larger source
    # while still bounding a hostile file's ability to consume host resources
    # (ADR-0015 §1).
    cpus: "1"
    mem_limit: 256m
    # Default 10s isn't quite enough: a real SIGTERM proof this phase (kill
    # -s SIGTERM against a live container) measured ~8s just for the
    # consumer's own clean group-leave (LeaveGroupRequest), before any
    # in-flight ffprobe call (up to 60s, media.py) even gets counted. 45s
    # covers the worst realistic single in-flight call plus that overhead.
    stop_grace_period: 45s
    profiles: ["app"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      SERVICE_NAME: worker-probe
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    read_only: true
    tmpfs:
      - /tmp
      # A tmpfs mount is a fresh filesystem, not a view onto the baked-in
      # /scratch dir — it does not inherit the image's chown, so the mount
      # itself must be owned by appuser (uid 10003) or ffmpeg gets EACCES on
      # its first temp file.
      - /scratch:uid=10003,gid=999
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Phase 12, ADR-0015 §1: "no network egress beyond Kafka/S3/Postgres."
    # media-internal is internal:true (no route out at all) — not on
    # `default` means this container has no path to the internet even if
    # ffmpeg/ffprobe were exploited by a hostile upload. kafka/postgres/
    # minio are also on media-internal (see kafka's own comment), so this
    # worker still reaches every dependency it actually needs.
    networks: [media-internal]
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  worker-transcode:
    build:
      context: ./backend
      dockerfile: services/worker_transcode/Dockerfile
      target: runtime
    container_name: vp-worker-transcode
    restart: unless-stopped
    # Sized from a real run, not guessed (Phase 12): docker stats during an
    # actual transcode peaked at ~154MiB / ~73% of one core against the
    # 2-second test fixture (real content will use more of both). cpus
    # matches FFMPEG_THREADS' own default (2) so the cgroup limit and
    # ffmpeg's own thread count agree — a mismatch either wastes threads
    # that get throttled or leaves the limit looser than the cap suggests.
    # 1g memory gives ~6x headroom over the observed baseline for a real
    # source (ADR-0015 §1).
    cpus: "2"
    mem_limit: 1g
    # The one worker where this actually matters (ADR-0015 §4: "grace period
    # above the p99 rendition time"): timeout_budget_s's own floor is 120s,
    # and real sources scale past it (source_duration_s * 8). 180s clears
    # that floor with margin plus the ~8s group-leave overhead measured live
    # this phase; Phase 14's real load numbers should revisit this once a
    # true p99 exists (today's number is reasoned, not measured under load).
    stop_grace_period: 180s
    profiles: ["app"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      SERVICE_NAME: worker-transcode
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    read_only: true
    tmpfs:
      - /tmp
      - /scratch:uid=10004,gid=999
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # See worker-probe's comment.
    networks: [media-internal]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  worker-thumbnail:
    build:
      context: ./backend
      dockerfile: services/worker_thumbnail/Dockerfile
      target: runtime
    container_name: vp-worker-thumbnail
    restart: unless-stopped
    # Sized from a real run, not guessed (Phase 12): docker stats during
    # actual poster+sprite generation peaked at ~88MiB / ~70% of one core
    # against the 2-second test fixture. cpus matches FFMPEG_THREADS' own
    # default for the same reason worker-transcode's does.
    cpus: "2"
    mem_limit: 512m
    # See worker-probe's comment: ~8s group-leave overhead measured live,
    # plus this worker's longest single ffmpeg call (60s, sprite sheet).
    stop_grace_period: 75s
    profiles: ["app"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      SERVICE_NAME: worker-thumbnail
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    read_only: true
    tmpfs:
      - /tmp
      - /scratch:uid=10006,gid=999
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # See worker-probe's comment.
    networks: [media-internal]
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  projector:
    build:
      context: ./backend
      dockerfile: services/projector/Dockerfile
      target: runtime
    container_name: vp-projector
    restart: unless-stopped
    # Sized from a real run, not guessed (Phase 12): docker stats during
    # actual traffic showed ~71MiB / <2% CPU — no ffmpeg, a plain DB write
    # per message. 256m/1 CPU is generous headroom, not a tight fit.
    cpus: "1"
    mem_limit: 256m
    # See worker-probe's comment for where the ~8s group-leave overhead
    # comes from. No ffmpeg call on this path at all — a plain DB write per
    # message — so the default 30s floor used elsewhere is already generous.
    stop_grace_period: 30s
    profiles: ["app"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SERVICE_NAME: projector
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  worker-package:
    build:
      context: ./backend
      dockerfile: services/worker_package/Dockerfile
      target: runtime
    container_name: vp-worker-package
    restart: unless-stopped
    # See projector's comment: ~91MiB / <1% CPU observed, a master.m3u8
    # write is fast, no ffmpeg here.
    cpus: "1"
    mem_limit: 256m
    stop_grace_period: 30s
    profiles: ["app"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      SERVICE_NAME: worker-package
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # Second consumer group on video.completed/pipeline.failed alongside
  # projector's — same events, independent offsets and lag (Phase 11,
  # PLAN.md's "second consumer group" case). No DB/S3: a webhook is
  # stateless from this side.
  worker-notify:
    build:
      context: ./backend
      dockerfile: services/worker_notify/Dockerfile
      target: runtime
    container_name: vp-worker-notify
    restart: unless-stopped
    # See projector's comment: ~61MiB / ~6% CPU observed, one HTTP POST,
    # no ffmpeg here.
    cpus: "1"
    mem_limit: 256m
    stop_grace_period: 30s
    profiles: ["app"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-http://webhook-sink:9100/webhook}
      NOTIFY_WEBHOOK_TIMEOUT_S: ${NOTIFY_WEBHOOK_TIMEOUT_S:-10.0}
      SERVICE_NAME: worker-notify
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # The component ADR-0002/0005/0009 all name and none of them scheduled
  # building (Phase 11) — drains every <topic>.retry.<tier> topic and
  # republishes to <topic> once each message's delay has elapsed. No DB/S3:
  # this only ever moves messages between topics.
  worker-retry-pump:
    build:
      context: ./backend
      dockerfile: services/worker_retry_pump/Dockerfile
      target: runtime
    container_name: vp-worker-retry-pump
    restart: unless-stopped
    # See projector's comment: ~61MiB / <1% CPU observed, mostly time.sleep,
    # no ffmpeg here.
    cpus: "1"
    mem_limit: 256m
    # Named, accepted limitation, not silently glossed over (same framing
    # this service's own main.py already uses for its one-message-at-a-time
    # design): the handler can legitimately time.sleep() up to a tier's own
    # delay (600s for "10m") before republishing. stop()'s "let the in-flight
    # handler finish" contract means a SIGTERM landing just as that sleep
    # starts would need a 600s+ grace period for a fully graceful exit, which
    # isn't worth paying for a dev/demo compose file. 60s here means a
    # SIGTERM during a long in-tier sleep gets SIGKILLed instead — the
    # message was never acked either way (offset only commits after the
    # republish succeeds), so redelivery on next start is exactly what
    # ADR-0005 already relies on, not silent loss.
    stop_grace_period: 60s
    profiles: ["app"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVICE_NAME: worker-retry-pump
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # A stand-in for the external system worker-notify's webhook actually
  # targets (Phase 11) — "the webhook fires" is otherwise unobservable from
  # inside this stack. Test double, but a real hardened service like any
  # other: nothing about serving from memory needs a writable filesystem.
  webhook-sink:
    build:
      context: ./backend
      dockerfile: services/webhook_sink/Dockerfile
    container_name: vp-webhook-sink
    restart: unless-stopped
    profiles: ["app"]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:9100/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # e2e-only: profiles keeps it out of plain `make up`. Not given the
  # ADR-0015 hardening the backend services get (read_only, tmpfs, cap_drop)
  # — it's test tooling that never runs in prod, not a deployed component,
  # and `vite preview` wants to write its own cache under node_modules/.vite.
  frontend:
    build:
      context: ./frontend
    container_name: vp-frontend
    profiles: ["e2e"]
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      # Resolved inside the compose network, not localhost (vite.config.ts's
      # proxy falls back to localhost for host-run `npm run dev`).
      VITE_PROXY_API_TARGET: http://api:8000
      VITE_PROXY_AUTH_TARGET: http://devauth:8080
    depends_on:
      api:
        condition: service_healthy
      devauth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5173',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot MinIO client for bucket bootstrap. profiles: keeps it out of `up`;
  # it runs via `docker compose run --rm mc "<command>"`.
  mc:
    image: minio/mc:latest
    container_name: vp-mc
    profiles: ["tools"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}

networks:
  default:
  # Phase 12, ADR-0015 §1: carries kafka/postgres/minio (also on `default`,
  # for their published host ports) plus the three ffmpeg-touching media
  # workers (only on this network — no route out at all, internal:true).
  # otel-collector and prometheus (docker-compose.obs.yml) join this too,
  # so tracing/scraping for those three workers still works when
  # `make obs-up` is layered on — trusted infra we own, safe to bridge.
  media-internal:
    internal: true

volumes:
  kafka-data:
  pg-data:
  minio-data:
