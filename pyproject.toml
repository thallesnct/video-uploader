[project]
name = "video-pipeline"
version = "0.1.0"
description = "Kafka-driven video transcoding pipeline with live SSE progress"
requires-python = ">=3.11"

# Ranges here, exact pins in uv.lock — the lockfile is what CI and the images
# install from (ADR-0014).
dependencies = [
  # API (ADR-0009: aiokafka on the async side, confluent-kafka in the workers)
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "gunicorn>=22.0",
  "sse-starlette>=2.1",
  "aiokafka>=0.11,<1.0",
  # Workers
  "confluent-kafka>=2.5,<3.0",
  # Contracts and config
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  # Storage and database
  "boto3>=1.35,<2.0",
  "aioboto3>=13.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.2,<4.0",
  # Reliability
  "tenacity>=8.2",
  # Observability (ADR-0010)
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "opentelemetry-sdk>=1.26",
  "opentelemetry-exporter-otlp>=1.26",
  "opentelemetry-instrumentation-fastapi>=0.47b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.47b0",
  "opentelemetry-instrumentation-botocore>=0.47b0",
  # Ops CLI
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "hypothesis>=6.100",
  "freezegun>=1.5",
  "testcontainers[kafka,postgres]>=4.8",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["libs/pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  # ffmpeg lives only in the worker image (ADR-0011); these skip on a bare host.
  "ffmpeg: requires the ffmpeg binary, runs inside the worker image",
  "slow: takes longer than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RET", "C4"]
# S603/S607: we intentionally invoke ffmpeg via subprocess with an argv list —
# that is the ADR-0014 decision, not an oversight. Never with shell=True.
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # asserts are the point

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true

# Strict where a mistake reaches every service (ADR-0014); pragmatic elsewhere.
[[tool.mypy.overrides]]
module = "pipeline.*"
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["confluent_kafka.*", "aioboto3.*", "testcontainers.*"]
ignore_missing_imports = true
