[project]
name = "video-pipeline"
version = "0.1.0"
description = "Kafka-driven video transcoding pipeline with live SSE progress"
requires-python = ">=3.11"

# Ranges here, exact pins in uv.lock — the lockfile is what CI and the images
# install from (ADR-0014).
dependencies = [
  # API (ADR-0009: aiokafka on the async side, confluent-kafka in the workers)
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "gunicorn>=22.0",
  "sse-starlette>=2.1",
  # [lz4] matters: librdkafka compiles lz4 in, but aiokafka needs the Python
  # package, so without this extra the API dies at startup while the workers
  # are fine — a split that only shows up when the async producer starts.
  "aiokafka[lz4]>=0.11,<1.0",
  # Workers
  "confluent-kafka>=2.5,<3.0",
  # Contracts and config
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  # Storage and database
  "boto3>=1.35,<2.0",
  "aioboto3>=13.0",
  # [asyncio] pulls greenlet, which SQLAlchemy needs for every async query.
  # Without it the API raises on its first database call while unit tests,
  # which never touch the DB, stay green.
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.2,<4.0",
  # Reliability
  "tenacity>=8.2",
  # Observability (ADR-0010)
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "opentelemetry-sdk>=1.26",
  "opentelemetry-exporter-otlp>=1.26",
  "opentelemetry-instrumentation-fastapi>=0.47b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.47b0",
  "opentelemetry-instrumentation-botocore>=0.47b0",
  # Identity (ADR-0016) — JWKS verification, and the dev issuer signs with it
  "pyjwt[crypto]>=2.9",
  # Ops CLI
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "hypothesis>=6.100",
  "freezegun>=1.5",
  "testcontainers[kafka,postgres]>=4.8",
  "requests>=2.32",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["libs/pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import the packages from the source tree rather than requiring an install.
# An editable install would drag in the build backend and pip's resolver, which
# is a slow, failure-prone step for something this simple.
pythonpath = ["libs", "."]
asyncio_mode = "auto"
markers = [
  # ffmpeg lives only in the worker image (ADR-0011); these skip on a bare host.
  "ffmpeg: requires the ffmpeg binary, runs inside the worker image",
  "slow: takes longer than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RET", "C4"]
# S603/S607: we intentionally invoke ffmpeg via subprocess with an argv list —
# that is the ADR-0014 decision, not an oversight. Never with shell=True.
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
# Asserts are the point; test fixtures use obviously fake credentials.
"tests/**" = ["S101", "S105", "S106"]
# infra/'s own S310 ignore lives in infra/ruff.toml — it's outside this tree.
# Field *names* like secret_key trip the hardcoded-password heuristic; the
# values come from the environment and are required (see the fail-fast tests).
"libs/pipeline/settings.py" = ["S105"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true

# Strict where a mistake reaches every service (ADR-0014); pragmatic elsewhere.
[[tool.mypy.overrides]]
module = "pipeline.*"
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["confluent_kafka.*", "aioboto3.*", "testcontainers.*", "boto3.*", "botocore.*", "aiokafka.*"]
ignore_missing_imports = true
