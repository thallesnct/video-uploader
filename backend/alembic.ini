# Migrations run as a pre-deploy job, never on application start (ADR-0015):
# several replicas starting at once must not race to migrate the same database.
[alembic]
script_location = migrations
prepend_sys_path = .
# sqlalchemy.url is intentionally absent — env.py reads DATABASE_URL so a
# connection string is never committed.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
